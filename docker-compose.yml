version: "3.8"

services:
  backend:
    image: backend
    container_name: backend
    restart: unless-stopped
    ports:
      - "8081:8081"    
      - "3306:3306"    
      - "5672:5672"    
      - "15672:15672"  
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bright_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: frontend
    container_name: frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8082:80"      
    networks:
      - bright_network

volumes:
  mysql_data:

networks:
  bright_network:
