server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 1) Sert les fichiers statiques si trouvés,
  # 2) sinon renvoie index.html pour le router React
  location / {
    try_files $uri $uri/ /index.html;
  }

  # (Optionnel) proxy_pass vers votre API
  # location /api/ {
  #   proxy_pass http://backend:8081/;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  # }
}
